<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Passcode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
    }

    /* Top bar with lock + Face ID circle */
    .top-bar {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .lock-pill {
      background: rgba(40, 40, 40, 0.95);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-icon {
      font-size: 18px;
      opacity: 0.9;
    }

    .faceid-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* Main text */
    .prompt {
      margin-top: 48px;
      text-align: center;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.2px;
      opacity: 0.95;
    }

    /* Passcode dots */
    .dots {
      display: flex;
      gap: 16px;
      margin-top: 28px;
      margin-bottom: 36px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: transparent;
      transition: background 0.08s ease;
    }

    .dot.filled {
      background: #fff;
      border-color: #fff;
    }

    /* Number pad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 26px;
      width: 78%;
      max-width: 300px;
    }

    .key {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: #333;
      color: #fff;
      font-size: 32px;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.06s ease, transform 0.06s ease;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .key:active {
      background: #555;
      transform: scale(0.94);
    }

    .key .letters {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      opacity: 0.75;
      margin-top: -2px;
      text-transform: uppercase;
    }

    .key-0 {
      grid-column: 2;
    }

    /* Bottom buttons */
    .bottom {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 28px;
    }

    .bottom-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      padding: 12px 8px;
      cursor: pointer;
      opacity: 0.9;
    }

    .bottom-btn:active {
      opacity: 0.5;
    }

    /* Result screen */
    .result {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }

    .result.show {
      display: flex;
    }

    .result .icon {
      font-size: 44px;
      margin-bottom: 16px;
    }

    .result h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result .sub {
      font-size: 16px;
      opacity: 0.65;
      margin-bottom: 36px;
    }

    .code {
      font-size: 40px;
      font-weight: 300;
      letter-spacing: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 16px 24px;
      border-radius: 14px;
      margin-bottom: 40px;
    }

    .reset {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      font-size: 16px;
      padding: 14px 36px;
      border-radius: 980px;
      cursor: pointer;
    }

    .reset:active {
      background: rgba(255, 255, 255, 0.28);
    }

    .click-btn {
      background: #333;
      border: none;
      color: #fff;
      font-size: 28px;
      font-weight: 500;
      padding: 22px 70px;
      border-radius: 16px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .click-btn:active {
      background: #555;
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- Top -->
    <div class="top-bar">
      <div class="lock-pill">
        <span class="lock-icon">🔒</span>
      </div>
      <div class="faceid-ring"></div>
    </div>

    <!-- Prompt -->
    <div class="prompt">
      Swipe up for Face ID or<br>Enter Passcode
    </div>

    <!-- Dots -->
    <div class="dots" id="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Keypad -->
    <div class="keypad" id="keypad">
      <button class="key" data-n="1">1</button>
      <button class="key" data-n="2">2<span class="letters">ABC</span></button>
      <button class="key" data-n="3">3<span class="letters">DEF</span></button>
      <button class="key" data-n="4">4<span class="letters">GHI</span></button>
      <button class="key" data-n="5">5<span class="letters">JKL</span></button>
      <button class="key" data-n="6">6<span class="letters">MNO</span></button>
      <button class="key" data-n="7">7<span class="letters">PQRS</span></button>
      <button class="key" data-n="8">8<span class="letters">TUV</span></button>
      <button class="key" data-n="9">9<span class="letters">WXYZ</span></button>
      <button class="key key-0" data-n="0">0</button>
    </div>

    <!-- Bottom -->
    <div class="bottom">
      <button class="bottom-btn" id="emergency">Emergency</button>
      <button class="bottom-btn" id="cancel">Cancel</button>
    </div>

    <!-- Click screen (appears after 6 digits) -->
    <div class="result" id="click-screen">
      <button class="click-btn" id="click-btn">Click</button>
    </div>

    <!-- Reveal screen (appears after clicking) -->
    <div class="result" id="result">
      <div class="icon">🔓</div>
      <h1>Unlocked</h1>
      <div class="sub">Passcode accepted</div>
      <div class="code" id="code">••••••</div>
      <button class="reset" id="reset">Try Again</button>
    </div>
  </div>

  <script>
    const dots = document.querySelectorAll('.dot');
    const keys = document.querySelectorAll('.key');
    const clickScreen = document.getElementById('click-screen');
    const result = document.getElementById('result');
    const codeEl = document.getElementById('code');
    const cancel = document.getElementById('cancel');
    const reset = document.getElementById('reset');
    const clickBtn = document.getElementById('click-btn');

    let pin = '';

    function updateDots() {
      dots.forEach((d, i) => {
        d.classList.toggle('filled', i < pin.length);
      });
    }

    function clear() {
      pin = '';
      updateDots();
      clickScreen.classList.remove('show');
      result.classList.remove('show');
    }

    keys.forEach(k => {
      k.addEventListener('click', () => {
        if (pin.length >= 6) return;
        pin += k.dataset.n;
        updateDots();
        if (pin.length === 6) {
          // Show the Click button instead of revealing immediately
          clickScreen.classList.add('show');
        }
      });
    });

    clickBtn.addEventListener('click', () => {
      clickScreen.classList.remove('show');
      codeEl.textContent = pin;
      result.classList.add('show');
    });

    cancel.addEventListener('click', clear);

    reset.addEventListener('click', () => {
      clear();
    });

    // Keyboard support for testing
    document.addEventListener('keydown', e => {
      if (clickScreen.classList.contains('show') || result.classList.contains('show')) return;
      if (/^[0-9]$/.test(e.key) && pin.length < 6) {
        pin += e.key;
        updateDots();
        if (pin.length === 6) {
          clickScreen.classList.add('show');
        }
      } else if (e.key === 'Backspace') {
        pin = pin.slice(0, -1);
        updateDots();
      } else if (e.key === 'Escape') {
        clear();
      }
    });
  </script>
</body>
</html>
