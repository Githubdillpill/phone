<!DOCTYPE html>
<html>
<head>
  <title>Gir Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="lockScreen">
    <h1>Swipe Up for Face ID or<br>Enter Passcode</h1>

    <div id="dots">○ ○ ○ ○ ○ ○</div>

    <div class="keypad">
      <button onclick="addNumber('1')">1</button>
      <button onclick="addNumber('2')">2</button>
      <button onclick="addNumber('3')">3</button>

      <button onclick="addNumber('4')">4</button>
      <button onclick="addNumber('5')">5</button>
      <button onclick="addNumber('6')">6</button>

      <button onclick="addNumber('7')">7</button>
      <button onclick="addNumber('8')">8</button>
      <button onclick="addNumber('9')">9</button>

      <div></div>

      <button onclick="addNumber('0')">0</button>

      <button onclick="deleteNumber()">⌫</button>
    </div>

    <div class="bottom">
      <button onclick="clearCode()">Emergency</button>
      <button onclick="clearCode()">Cancel</button>
    </div>
  </div>


  <div id="homeScreen" class="hidden">

    <button class="passwordApp" onclick="openPassword()">
      🔐
      <br>
      Password
    </button>

  </div>


  <div id="passwordScreen" class="hidden">

    <button onclick="goHome()">← Back</button>

    <h1>Password</h1>

    <p>You entered:</p>

    <div id="passwordResult"></div>

  </div>


  <script src="script.js"></script>

</body>
</html>
