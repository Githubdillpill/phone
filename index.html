    /* Overlay for the interactive dots - positioned over the empty ones in the image */
    .passcode-dots {
      position: absolute;
      top: 26.0%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 17px;
      z-index: 10;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      background: transparent;
      transition: background 0.12s ease;
    }

    .dot.filled {
      background: #fff;
    }

    /* Invisible but clickable number buttons overlaid exactly on the image keypad */
    .keypad {
      position: absolute;
      top: 36.2%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 340px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 14px 18px;
      z-index: 20;
    }

    .key {
      aspect-ratio: 1;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Larger hit area so taps register reliably */
      margin: -6px;
    }

    .key::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0);
      transition: background 0.1s ease;
    }

    .key:active::before {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Special position for 0 which is centered under 8 */
    .key-0 {
      grid-column: 2;
    }

    /* Bottom bar: Emergency and Cancel - invisible clickable areas */
    .bottom-bar {
      position: absolute;
      bottom: 4.5%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 12%;
      z-index: 20;
    }

    .bottom-btn {
      background: transparent;
      border: none;
      color: transparent;
      font-size: 17px;
      padding: 12px 20px;
      cursor: pointer;
      min-width: 90px;
    }

    .bottom-btn:active {
      opacity: 0.5;
    }

    /* Unlock / result screen */
    .result-screen {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      padding: 40px 24px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .result-screen.visible {
      display: flex;
      opacity: 1;
    }

    .result-screen .lock-icon {
      font-size: 48px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .result-screen h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .result-screen .subtitle {
      font-size: 17px;
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .entered-code {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 12px;
      background: rgba(255, 255, 255, 0.1);
      padding: 18px 28px;
      border-radius: 16px;
      margin-bottom: 40px;
      font-variant-numeric: tabular-nums;
    }

    .result-screen .hint {
      font-size: 15px;
      opacity: 0.5;
      max-width: 280px;
      line-height: 1.4;
    }

    .reset-btn {
      margin-top: 50px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      font-size: 17px;
      padding: 14px 32px;
      border-radius: 980px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .reset-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Small shake animation for visual feedback (optional) */
    @keyframes shake {
      0%, 100% { transform: translateX(-50%); }
      20%, 60% { transform: translateX(calc(-50% - 6px)); }
      40%, 80% { transform: translateX(calc(-50% + 6px)); }
    }

    .passcode-dots.shake {
      animation: shake 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <!-- Passcode dots overlay (covers the empty ones in the photo) -->
    <div class="passcode-dots" id="dots">
      <div class="dot" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
      <div class="dot" data-index="3"></div>
      <div class="dot" data-index="4"></div>
      <div class="dot" data-index="5"></div>
    </div>

    <!-- Clickable keypad overlay -->
    <div class="keypad" id="keypad">
      <button class="key" data-num="1" aria-label="1"></button>
      <button class="key" data-num="2" aria-label="2"></button>
      <button class="key" data-num="3" aria-label="3"></button>
      <button class="key" data-num="4" aria-label="4"></button>
      <button class="key" data-num="5" aria-label="5"></button>
      <button class="key" data-num="6" aria-label="6"></button>
      <button class="key" data-num="7" aria-label="7"></button>
      <button class="key" data-num="8" aria-label="8"></button>
      <button class="key" data-num="9" aria-label="9"></button>
      <button class="key key-0" data-num="0" aria-label="0"></button>
    </div>

    <!-- Emergency / Cancel -->
    <div class="bottom-bar">
      <button class="bottom-btn" id="emergency">Emergency</button>
      <button class="bottom-btn" id="cancel">Cancel</button>
    </div>

    <!-- Result / reveal screen -->
    <div class="result-screen" id="result">
      <div class="lock-icon">🔓</div>
      <h1>Unlocked</h1>
      <p class="subtitle">Passcode accepted</p>
      <div class="entered-code" id="revealed-code">••••••</div>
      <p class="hint">This is the passcode that was entered.<br>Perfect for the reveal.</p>
      <button class="reset-btn" id="reset">Try Again</button>
    </div>
  </div>

  <script>
    (function () {
      const dots = document.querySelectorAll('.dot');
      const keys = document.querySelectorAll('.key');
      const resultScreen = document.getElementById('result');
      const revealedCode = document.getElementById('revealed-code');
      const resetBtn = document.getElementById('reset');
      const cancelBtn = document.getElementById('cancel');
      const emergencyBtn = document.getElementById('emergency');
      const dotsContainer = document.getElementById('dots');

      let entered = '';
      const MAX_LENGTH = 6;

      function updateDots() {
        dots.forEach((dot, i) => {
          if (i < entered.length) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        });
      }

      function clearEntry() {
        entered = '';
        updateDots();
      }

      function unlock() {
        // Small delay so the last dot fills before transition
        setTimeout(() => {
          revealedCode.textContent = entered;
          resultScreen.classList.add('visible');
        }, 180);
      }

      keys.forEach(key => {
        key.addEventListener('click', () => {
          if (entered.length >= MAX_LENGTH) return;
          const num = key.getAttribute('data-num');
          entered += num;
          updateDots();

          if (entered.length === MAX_LENGTH) {
            // Any code is accepted — the magic happens here
            unlock();
          }
        });
      });

      cancelBtn.addEventListener('click', () => {
        clearEntry();
      });

      emergencyBtn.addEventListener('click', () => {
        // Do nothing special — keeps the illusion
        // Or optionally: alert('Emergency call simulation');
      });

      resetBtn.addEventListener('click', () => {
        resultScreen.classList.remove('visible');
        clearEntry();
      });

      // Optional: allow keyboard input for desktop testing
      document.addEventListener('keydown', (e) => {
        if (resultScreen.classList.contains('visible')) return;
        if (/^[0-9]$/.test(e.key)) {
          if (entered.length >= MAX_LENGTH) return;
          entered += e.key;
          updateDots();
          if (entered.length === MAX_LENGTH) unlock();
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
          entered = entered.slice(0, -1);
          updateDots();
        } else if (e.key === 'Escape') {
          clearEntry();
        }
      });
    })();
  </script>
</body>
</html>
